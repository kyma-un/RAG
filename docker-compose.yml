services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    env_file:
      - .env
    environment:
      API_ROOT_PATH: /api
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      LOG_DB_PATH: ${LOG_DB_PATH:-/app/logs/logs.db}
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-WAL}
    expose:
      - "8000"
    volumes:
      - rag_vector_store:/app/vector_store
      - rag_logs:/app/logs
      - rag_files:/app/files
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - rag_net

  rag-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-dashboard
    command: streamlit run app/dashboard.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    environment:
      LOG_DB_PATH: ${LOG_DB_PATH:-/app/logs/logs.db}
    expose:
      - "8501"
    volumes:
      - rag_logs:/app/logs
    profiles:
      - dashboard
    restart: unless-stopped
    networks:
      - rag_net

  frontend:
    image: ${FRONTEND_IMAGE:-nginx:stable-alpine}
    container_name: chatbot-frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - rag_net

  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: rag-reverse-proxy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      rag-api:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    networks:
      - rag_net

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama
    restart: unless-stopped
    networks:
      - rag_net

networks:
  rag_net:
    driver: bridge

volumes:
  rag_vector_store:
  rag_logs:
  rag_files:
  ollama_data:
  caddy_data:
  caddy_config:
